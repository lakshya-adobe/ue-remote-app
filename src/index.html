<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UeRemoteApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <script src="https://universal-editor-service.adobe.io/cors.js" defer></script>

  <!-- Universal Editor Connection - Values set dynamically from environment -->
  <meta name="urn:adobe:aue:config:service" content="https://localhost:8000">
  <meta name="urn:adobe:aue:system:aemconnection" content="aem:https://localhost:8443">

  <!-- Universal Editor Definitions (served from /public → / at runtime) -->
<!--  <script type="application/aue:definition:component+json" src="/static/component-definition.json"></script>-->
<!--  <script type="application/aue:definition:filter+json" src="/static/filter-definition.json"></script>-->

<script type="application/vnd.adobe.aue.component+json">
  {
    "groups": [
      {
        "title": "Content Fragments",
        "id": "content-fragments",
        "components": [
          {
            "title": "Page",
            "id": "page",
            "plugins": {
              "aem": {
                "cf": {
                  "name": "page",
                  "cfModel": "/conf/securbank/settings/dam/cfm/models/page",
                  "cfFolder": "/content/dam/securbank/pages",
                  "title": "Page",
                  "template": {
                    "title": "New Page",
                    "slug": "new-page"
                  }
                }
              }
            }
          },
          {
            "title": "Article",
            "id": "article",
            "plugins": {
              "aem": {
                "cf": {
                  "name": "article",
                  "cfModel": "/conf/securbank/settings/dam/cfm/models/article",
                  "cfFolder": "/content/dam/securbank/pages/articles",
                  "title": "Article",
                  "template": {
                    "title": "New Article",
                    "slug": "new-article",
                    "image": "/content/dam/securbank/services/default-service-illustration.jpg"
                  }
                }
              }
            }
          },
          {
            "title": "Service",
            "id": "service",
            "plugins": {
              "aem": {
                "cf": {
                  "name": "service",
                  "cfModel": "/conf/securbank/settings/dam/cfm/models/service",
                  "cfFolder": "/content/dam/securbank/services",
                  "title": "Service",
                  "template": {
                    "title": "New Service",
                    "slug": "new-service",
                    "icon": "/content/dam/securbank/services/default-service-illustration.jpg"
                  }
                }
              }
            }
          }
        ]
      }
    ]
  }
</script>

  <script type="application/vnd.adobe.aue.model+json">
    [
      {
        "id": "featured-services",
        "components": ["service"]
      },
      {
        "id": "related-articles",
        "components": ["article"]
      }
    ]

  </script>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
