<div class="background-blue">
  <div class="container hero-wrapper">
    <div class="content-button-wrapper">
      <div class="content-wrapper">
        <h1 class="color-light"
            data-aue-prop="title"
            data-aue-type="text"
            data-aue-label="Title">
          {{ title }}
        </h1>
        <div data-aue-prop="content"
             data-aue-label="Content"
             data-aue-type="text"
             class="color-grey"
             [innerHTML]="getContentText()">
        </div>
      </div>
      <a href="/services">
        <button class="hover-effect">Our Services</button>
      </a>
    </div>
    <img [src]="image || 'https://localhost:8443'"
         alt="Hero banner"
         class="hover-effect"
         data-aue-prop="image"
         data-aue-type="media"
         data-aue-label="Image">
  </div>
</div>
